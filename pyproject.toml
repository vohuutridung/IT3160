[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it3160"
version = "0.1.0"
description = "Supervised chess policy project: reproducible data preparation"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.999,<2",
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
    "pyarrow>=14,<27",
    "huggingface-hub>=0.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
it3160-data = "IT3160.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
